<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>$title · Maximus</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f3ec; --fg: #1f1b16; --muted: #5d554b; --line: #d9d0c2; --accent: #8a2d1c; --danger: #a3221a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15120f; --fg: #efe8dd; --muted: #b3a998; --line: #3a332b; --accent: #e08a6b; --danger: #f07b6e; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 Georgia, "Times New Roman", serif; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.7rem; line-height: 1.2; margin: 0 0 16px; }
  h2 { font-size: 1.15rem; margin: 28px 0 8px; }
  p, li { color: var(--fg); }
  .muted { color: var(--muted); font-size: 0.95rem; }
  a { color: var(--accent); }
  form { margin: 20px 0; }
  label { display: block; font-weight: bold; margin: 12px 0 6px; }
  input[type=email], input[type=password] { width: 100%; padding: 12px; font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 8px; }
  button { margin-top: 16px; padding: 12px 20px; font: inherit; font-weight: bold; border: 0; border-radius: 8px; background: var(--accent); color: var(--bg); cursor: pointer; }
  button.danger { background: var(--danger); }
  .error { color: var(--danger); }
  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<main>
$body
<footer class="muted"><a href="/privacy">Privacy policy</a> · <a href="/account/delete">Delete your account</a></footer>
</main>
</body>
</html>
