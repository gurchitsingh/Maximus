name: purge

# Daily retention purge (CONTRACTS 15.4, 16). Render has no free cron job, so it runs here.
# Needs one repository SECRET named PURGE_DATABASE_URL: Neon's pooled URL.
# The run FAILS while the secret is unset, and when the purge itself fails.
# A workflow disabled by hand (or by GitHub after 60 quiet days) stays disabled and runs nothing, so it
# cannot turn red. To enable it: repo > Actions > purge > "Enable workflow", or `gh workflow enable purge.yml`.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PURGE_DATABASE_URL }}
      ENVIRONMENT: development   # the job needs no JWT secret; production checks belong to the web service
    steps:
      - name: Require the secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PURGE_DATABASE_URL is not set, nothing was purged. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Purge
        working-directory: backend
        run: |
          if ! python -m app.jobs purge; then
            echo "::error::The retention purge failed, expired data may still be stored. See the log above."
            exit 1
          fi
