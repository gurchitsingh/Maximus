name: purge

# Daily retention purge (CONTRACTS 15.4, 16). Render has no free cron job, so it runs here.
# Needs one repository SECRET named PURGE_DATABASE_URL: Neon's pooled URL. Skipped while the secret is unset.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PURGE_DATABASE_URL }}
      ENVIRONMENT: development   # the job needs no JWT secret; production checks belong to the web service
    steps:
      - name: Skip when the secret is not set
        id: gate
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "PURGE_DATABASE_URL not set: skipping"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r backend/requirements.txt
      - name: Purge
        if: steps.gate.outputs.run == 'true'
        working-directory: backend
        run: python -m app.jobs purge
