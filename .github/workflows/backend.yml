name: backend

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            tools/requirements.txt
      - name: Install backend dev dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Install tools dependencies
        run: pip install -r tools/requirements.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest
      - name: Validate samples
        run: python tools/validate_samples.py

  # CONTRACTS 18: production is Postgres. Same suite, plus the Alembic chain up, down and up again.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # CI-only throwaway database; not a secret.
          POSTGRES_USER: maximus
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: maximus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maximus -d maximus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgresql://maximus:ci-only-password@localhost:5432/maximus_test
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dev dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Migrations up, down, up
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: pytest on Postgres
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
        run: python -m pytest
