name: maximus
description: "Maximus: short history lessons, quizzes and a fact feed. Android first."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  cached_network_image: ^4.0.7
  # Draws the custom icon paths and logo from DESIGN_SPEC 10.1 and 10.4 exactly.
  flutter_svg: ^2.5.0
  drift: ^2.35.4
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_tts: ^4.2.5
  drift_flutter: ^0.3.1
  meta: ^1.19.0
  json_annotation: ^4.12.0
  url_launcher: ^6.3.3
  dio: ^5.11.1
  flutter_cache_manager: ^3.5.0
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Figtree/OFL.txt
    - assets/fonts/Cinzel/OFL.txt
    - assets/fonts/CaveatBrush/OFL.txt
    - assets/fonts/BigShouldersStencil/OFL.txt
    - assets/credits/fonts.json
    - assets/facts/facts.json
    # Copies of backend/data/samples and docs/examples (CONTRACTS 8.1) until
    # S12 wires the API. test/data/dev_assets_test.dart keeps them in sync.
    - assets/dev/
    # Bundled SVG posters + manifest.json (CONTRACTS 21).
    - assets/posters/

  # All fonts are SIL OFL 1.1, bundled so the app works offline (DESIGN_SPEC 2.1).
  # Licence texts are registered with LicenseRegistry in lib/core/theme/font_licenses.dart.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree/Figtree-500.ttf
          weight: 500
        - asset: assets/fonts/Figtree/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree/Figtree-700.ttf
          weight: 700
        - asset: assets/fonts/Figtree/Figtree-800.ttf
          weight: 800
        - asset: assets/fonts/Figtree/Figtree-900.ttf
          weight: 900
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel/Cinzel-700.ttf
          weight: 700
    - family: Caveat Brush
      fonts:
        - asset: assets/fonts/CaveatBrush/CaveatBrush-400.ttf
          weight: 400
    - family: Big Shoulders Stencil Display
      fonts:
        - asset: assets/fonts/BigShouldersStencil/BigShouldersStencilDisplay-900.ttf
          weight: 900
