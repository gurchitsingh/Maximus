# Render Blueprint for the Maximus API (S22). Names only: every secret is sync:false (typed once in the Render
# dashboard) or generated by Render. Nothing here may hold a secret: this repo is public.
# Steps: backend/DEPLOY.md.
#
# Free plan facts (checked against render.com/docs on 2026-11-25):
#  - no preDeployCommand and no free cron jobs, so migrations run in the BUILD command (a failed migration
#    fails the deploy and the old version keeps serving) and the daily purge runs from GitHub Actions
#    (.github/workflows/purge.yml). A paid Render cron job block is kept below, commented out.
#  - sleeps after 15 min idle, about 1 minute to wake; the disk is wiped on every deploy and restart.
services:
  - type: web
    name: maximus-api
    runtime: python
    plan: free
    region: frankfurt          # pick the region nearest your users and Neon project; they should match
    rootDir: backend
    # Neon's DIRECT url (DATABASE_URL_DIRECT) is used by Alembic only; the app itself uses the pooled DATABASE_URL.
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    # One worker only: the rate limits live in memory. --no-proxy-headers: uvicorn must not take the client IP
    # from X-Forwarded-For (with "*" it took the leftmost entry, which the client chooses: SECURITY_AUDIT H1).
    # The app reads the header itself, trusting only the last TRUSTED_PROXY_HOPS entries (below).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /healthz
    autoDeploy: false          # deploy from the dashboard (or a deploy hook) after tests are green
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: SERVE_DRAFTS
        value: "false"
      - key: TRUSTED_PROXY_HOPS        # the last X-Forwarded-For entry (Render's proxy). UNVERIFIED: Render's
        value: "1"                     # docs do not say how it sets the header; check DEPLOY.md "Client IP"
      - key: DATABASE_URL            # Neon POOLED url, sslmode=require
        sync: false
      - key: DATABASE_URL_DIRECT     # Neon DIRECT url, sslmode=require
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INSTALL_ID_SALT
        generateValue: true
      - key: APP_BASE_URL            # https://<service>.onrender.com, no trailing slash
        sync: false
      - key: MEDIA_BASE_URL          # see DEPLOY.md "Media"; unused until storage is chosen
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_PROVIDER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

